<!doctype html>
<html lang="da">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Developer Application | Esmark</title>
    <meta name="description"
        content="Personal application landingpage by Janina-Cindy Ortelt for the Frontend udvikler role at Esmark. Multilingual, UX-focused, and linked to portfolio evidence." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <div class="bg-orb orb-a" aria-hidden="true"></div>
    <div class="bg-orb orb-b" aria-hidden="true"></div>

    <header class="top-nav">
        <a class="brand" href="#intro">
            <span class="brand-dot"></span>
            Janina-Cindy Ortelt
        </a>

        <nav class="section-nav" aria-label="Page Navigation">
            <a href="#intro" data-nav="intro" data-i18n="nav.intro"></a>
            <a href="#motivation" data-nav="motivation" data-i18n="nav.motivation"></a>
            <a href="#tech" data-nav="tech" data-i18n="nav.tech"></a>
            <a href="#ux" data-nav="ux" data-i18n="nav.ux"></a>
            <a href="#projects" data-nav="projects" data-i18n="nav.projects"></a>
            <a href="#teamwork" data-nav="teamwork" data-i18n="nav.teamwork"></a>
            <a href="#diplomas" data-nav="diplomas" data-i18n="nav.diplomas"></a>
            <a href="#closing" data-nav="closing" data-i18n="nav.closing"></a>
        </nav>

        <div class="top-actions">
            <nav class="lang-switch" aria-label="Language Switcher">
                <button type="button" class="lang-btn" data-lang="en">EN</button>
                <button type="button" class="lang-btn active" data-lang="da">DA</button>
            </nav>

            <a class="top-profile" href="#intro" aria-label="Logged in profile">
                <img src="/frontend/profile.png" alt="Janina-Cindy Ortelt" />
                <span class="top-profile-status" data-i18n-title="top.loggedIn" title="Logged in"></span>
            </a>
        </div>
    </header>

    <main>
        <section class="hero reveal" id="intro">
            <div class="hero-backdrop" aria-hidden="true">
                <img src="/frontend/header.jpg" alt="" loading="lazy" />
            </div>

            <div class="hero-copy">
                <p class="kicker" data-i18n="hero.kicker"></p>
                <h1 data-i18n="hero.title"></h1>
                <p class="hero-lead" data-i18n="hero.lead"></p>
            </div>
        </section>

        <section class="section reveal" id="motivation">
            <div class="section-head">
                <p class="section-tag" data-i18n="motivation.tag"></p>
                <h2>
                    <iconify-icon icon="ph:lightbulb-filament"></iconify-icon>
                    <span data-i18n="motivation.title"></span>
                </h2>
            </div>
            <article class="application-letter">
                <p data-i18n="motivation.p1"></p>
                <p data-i18n="motivation.p2"></p>
            </article>
        </section>

        <section class="section reveal" id="tech">
            <div class="section-head">
                <p class="section-tag" data-i18n="tech.tag"></p>
                <h2>
                    <iconify-icon icon="ph:code-simple"></iconify-icon>
                    <span data-i18n="tech.title"></span>
                </h2>
            </div>
            <article class="application-letter">
                <p data-i18n="tech.p1"></p>
                <p data-i18n="tech.p2"></p>
                <p data-i18n="tech.p3"></p>
            </article>
        </section>

        <section class="section reveal" id="ux">
            <div class="section-head">
                <p class="section-tag" data-i18n="ux.tag"></p>
                <h2>
                    <iconify-icon icon="ph:palette"></iconify-icon>
                    <span data-i18n="ux.title"></span>
                </h2>
            </div>
            <article class="application-letter">
                <p data-i18n="ux.p1"></p>
                <p data-i18n="ux.p2"></p>
            </article>
        </section>

        <section class="section reveal" id="projects">
            <div class="section-head">
                <p class="section-tag" data-i18n="projects.tag"></p>
                <h2>
                    <iconify-icon icon="ph:rocket-launch"></iconify-icon>
                    <span data-i18n="projects.title"></span>
                </h2>
            </div>
            <article class="application-letter">
                <p data-i18n="projects.p1"></p>
                <p data-i18n="projects.p2"></p>
            </article>

            <div class="proof-list">
                <article class="proof-item">
                    <h3 data-i18n="projects.aTitle"></h3>
                    <a href="/projects/vacation-rental" target="_blank" rel="noopener noreferrer"
                        data-i18n="projects.aLink"></a>
                </article>
                <article class="proof-item">
                    <h3 data-i18n="projects.bTitle"></h3>
                    <a href="/projects/manga-collection" target="_blank" rel="noopener noreferrer"
                        data-i18n="projects.bLink"></a>
                </article>
                <article class="proof-item">
                    <h3 data-i18n="projects.cTitle"></h3>
                    <a href="https://github.com/jcogit" target="_blank" rel="noopener noreferrer"
                        data-i18n="projects.cLink"></a>
                </article>
            </div>
        </section>

        <section class="section reveal" id="teamwork">
            <div class="section-head">
                <p class="section-tag" data-i18n="teamwork.tag"></p>
                <h2>
                    <iconify-icon icon="ph:handshake"></iconify-icon>
                    <span data-i18n="teamwork.title"></span>
                </h2>
            </div>

            <article class="application-letter">
                <p data-i18n="teamwork.p1"></p>
                <p data-i18n="teamwork.p2"></p>
            </article>

            <div class="coast-grid" aria-hidden="true">
                <article class="coast-tile">
                    <img src="/frontend/duenengras-bei-sonnenuntergang_302939761_adobe.webp" alt="Nordic beach dunes"
                        loading="lazy" />
                </article>
                <article class="coast-tile">
                    <img src="/frontend/white-seagull-flying-coast.jpg" alt="Coastal architecture" loading="lazy" />
                </article>
                <article class="coast-tile">
                    <img src="/frontend/wunderschoener-sonnenaufgang-am-strand-der-die-perfekte-kulisse-fuer-morgendliche-spaziergaenge-am-ufer-schafft_181624-7757.avif"
                        alt="Holiday feeling by the sea" loading="lazy" />
                </article>
            </div>
        </section>

        <section class="section reveal" id="diplomas">
            <div class="section-head">
                <p class="section-tag" data-i18n="diplomas.tag"></p>
                <h2>
                    <iconify-icon icon="ph:certificate"></iconify-icon>
                    <span data-i18n="diplomas.title"></span>
                </h2>
            </div>

            <p class="section-copy" data-i18n="diplomas.copy"></p>

            <div class="diploma-grid">
                <article class="diploma-card">
                    <figure class="diploma-preview">
                        <img src="/frontend/webDevelopment.png" alt="Web Development diploma preview" loading="lazy" />
                    </figure>
                    <h3 data-i18n="diplomas.webdevTitle"></h3>
                    <p data-i18n="diplomas.webdevDesc"></p>
                    <div class="diploma-actions">
                        <a class="diploma-link" href="/frontend/webdevelopment.pdf" target="_blank"
                            rel="noopener noreferrer" data-i18n="diplomas.open"></a>
                        <a class="diploma-link ghost" href="/frontend/webdevelopment.pdf" download
                            data-i18n="diplomas.download"></a>
                    </div>
                </article>

                <article class="diploma-card">
                    <figure class="diploma-preview">
                        <img src="/frontend/multimediaDesign.png" alt="Multimedia Design diploma preview"
                            loading="lazy" />
                    </figure>
                    <h3 data-i18n="diplomas.multimediaTitle"></h3>
                    <p data-i18n="diplomas.multimediaDesc"></p>
                    <div class="diploma-actions">
                        <a class="diploma-link" href="/frontend/multimediadesign.pdf" target="_blank"
                            rel="noopener noreferrer" data-i18n="diplomas.open"></a>
                        <a class="diploma-link ghost" href="/frontend/multimediadesign.pdf" download
                            data-i18n="diplomas.download"></a>
                    </div>
                </article>
            </div>
        </section>

        <section class="section reveal closing" id="closing">
            <h2>
                <iconify-icon icon="ph:star-four"></iconify-icon>
                <span data-i18n="closing.title"></span>
            </h2>
            <p data-i18n="closing.copy"></p>
            <p class="letter-signature" data-i18n="closing.signature"></p>
            <div class="cta-row">
                <a class="cta primary"
                    href="mailto:janinacindy@gmail.com?subject=Frontend%20udvikler%20application%20-%20Janina-Cindy%20Ortelt"
                    data-i18n="closing.ctaContactMe"></a>
                <a class="cta ghost" href="/" target="_blank" rel="noopener noreferrer"
                    data-i18n="closing.ctaPortfolio"></a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p data-i18n="footer.copy"></p>
        <a href="/" target="_blank" rel="noopener noreferrer" data-i18n="footer.portfolio"></a>
    </footer>

    <script src="./script.js"></script>
</body>

</html>
